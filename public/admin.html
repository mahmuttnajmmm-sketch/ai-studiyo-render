<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Studio Yönetim</title><style>
:root{font-family:Inter,system-ui,sans-serif;color:#e5e7eb;background:#0b1020}*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:28px;background:radial-gradient(circle at 10% 0,#243b7a 0,#0b1020 42%)}main{width:min(900px,100%);margin:auto}.card{background:#111a2eeb;border:1px solid #334155;border-radius:18px;padding:24px;box-shadow:0 20px 70px #02061766}h1,h2{margin-top:0}p{color:#aebbd0}.eyebrow{color:#7dd3fc;font-weight:800;letter-spacing:.12em;text-transform:uppercase;font-size:12px}.field{display:flex;flex-direction:column;gap:7px;margin:14px 0}label{font-weight:700}input,textarea{font:inherit;color:#e5e7eb;background:#0b1326;border:1px solid #475569;border-radius:10px;padding:11px}textarea{min-height:130px;resize:vertical}.btn{border:0;border-radius:10px;padding:11px 16px;font-weight:800;cursor:pointer;color:#07111f;background:#bae6fd}.btn.secondary{color:#e5e7eb;background:#263550}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.modules{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin:14px 0}.module{border:1px solid #334155;border-radius:12px;padding:12px;background:#0b1326}.module label{display:flex;justify-content:space-between;gap:8px}.status{min-height:22px;color:#93c5fd}.danger{color:#fecaca}.hidden{display:none!important}.link{color:#7dd3fc;word-break:break-all}</style></head>
<body><main><section class="card" id="login"><p class="eyebrow">AI Studio Atölyesi</p><h1>Gizli yönetim</h1><p>Bu ekran yalnızca yönetici parolasıyla açılır. Parola sunucu tarafında doğrulanır.</p><form id="login-form"><div class="field"><label for="password">Yönetici parolası</label><input id="password" type="password" autocomplete="current-password" required></div><button class="btn" type="submit">Yönetim paneline gir</button><p class="status danger" id="login-status"></p></form></section><section class="card hidden" id="panel"><p class="eyebrow">Kontrol merkezi</p><div class="row" style="justify-content:space-between"><h1>Site ayarları</h1><button class="btn secondary" id="logout">Çıkış yap</button></div><p>Buradaki değişiklikler herkese açık siteye uygulanır. Modüller silinmez; yalnızca görünürlükleri yönetilir.</p><form id="settings-form"><div class="field"><label for="announcement">Site duyurusu</label><textarea id="announcement" placeholder="İsteğe bağlı duyuru..."></textarea></div><h2>Modüller</h2><div class="modules"><div class="module"><label>Prompt Atölyesi <input type="checkbox" data-module="prompt"></label></div><div class="module"><label>Asistan <input type="checkbox" data-module="chat"></label></div><div class="module"><label>Akıllı Tablo <input type="checkbox" data-module="sheet"></label></div><div class="module"><label>Ödev &amp; Sınav <input type="checkbox" data-module="lab"></label></div><div class="module"><label>Oyun Oluşturucu <input type="checkbox" data-module="generator"></label></div><div class="module"><label>Video Editörü <input type="checkbox" data-module="video"></label></div></div><button class="btn" type="submit">Ayarları kaydet</button><p class="status" id="save-status"></p></form></section></main><script>
const $=s=>document.querySelector(s),login=$('#login'),panel=$('#panel');
async function request(url,options={}){const r=await fetch(url,{credentials:'same-origin',...options,headers:{'Content-Type':'application/json',...(options.headers||{})}});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'İstek başarısız.');return d}
function showPanel(settings){login.classList.add('hidden');panel.classList.remove('hidden');$('#announcement').value=settings.announcement||'';document.querySelectorAll('[data-module]').forEach(x=>x.checked=settings.modules?.[x.dataset.module]!==false)}
async function init(){try{const s=await request('/api/admin/session');if(s.authenticated)showPanel(await request('/api/admin/settings'))}catch(e){$('#login-status').textContent=e.message}}
$('#login-form').addEventListener('submit',async e=>{e.preventDefault();$('#login-status').textContent='Kontrol ediliyor...';try{await request('/api/admin/login',{method:'POST',body:JSON.stringify({password:$('#password').value})});$('#password').value='';showPanel(await request('/api/admin/settings'))}catch(e){$('#login-status').textContent=e.message}});
$('#settings-form').addEventListener('submit',async e=>{e.preventDefault();$('#save-status').textContent='Kaydediliyor...';const modules={};document.querySelectorAll('[data-module]').forEach(x=>modules[x.dataset.module]=x.checked);try{await request('/api/admin/settings',{method:'POST',body:JSON.stringify({announcement:$('#announcement').value,modules})});$('#save-status').textContent='Ayarlar kaydedildi.'}catch(e){$('#save-status').textContent=e.message}});$('#logout').onclick=async()=>{await request('/api/admin/logout',{method:'POST'});location.reload()};init();
</script></body></html>
